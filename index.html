*{box-sizing:border-box}html{scroll-behavior:smooth}
.lyo{--red:#e11d2e;--red2:#ff4757;--bg:#0a0a0c;--card:#141418;--line:#26262d;--txt:#f4f4f6;--mut:#a1a1ab;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55;overflow-x:hidden;position:relative;isolation:isolate}
.lyo h1,.lyo h2,.lyo h3{margin:0;line-height:1.1;letter-spacing:-.02em}
.lyo h1{font-size:clamp(38px,9vw,76px);font-weight:800}
.lyo h2{font-size:clamp(30px,6vw,52px);font-weight:800}
.lyo h3{font-size:19px;font-weight:700}
.lyo p{margin:0}
.lyo h1 span,.lyo h2 span{color:var(--red2)}
.lyo a{color:inherit;text-decoration:none}
.lyo .muted{color:var(--mut)}
.lyo .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--red2);margin-bottom:18px}
.lyo .status-dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);display:inline-block}
.lyo .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:15px 26px;font-weight:700;font-size:15px;cursor:pointer;transition:.2s;font-family:inherit}
.lyo .button:hover{background:var(--red2);transform:translateY(-2px)}
.lyo .button.outline{background:transparent;border:1px solid #444}
.lyo .button.outline:hover{border-color:var(--red2)}
.lyo .text-link{display:inline-flex;align-items:center;gap:6px;color:var(--red2);font-weight:700}
.lyo .section{padding:84px 22px;max-width:1180px;margin:0 auto;scroll-margin-top:60px}
.lyo .hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:110px 22px 130px;background:radial-gradient(circle at 70% 30%,rgba(58,10,16,.75),transparent 65%);overflow:hidden}
.lyo .hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.lyo .hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,12,.78) 8%,rgba(10,10,12,.45) 60%,rgba(10,10,12,.12)),linear-gradient(0deg,var(--bg),transparent 40%)}
.lyo .hero-content{position:relative;max-width:1180px;width:100%;margin:0 auto}
.lyo .hero-description{margin:22px 0 30px;font-size:18px;color:#d4d4da;max-width:480px}
.lyo .hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.lyo .hero-trust{display:flex;align-items:center;gap:12px;margin-top:28px;color:var(--mut);font-size:14px}
.lyo .stars{display:flex;gap:2px;color:#ffc53d}
.lyo .mockup-label,.lyo .scroll-note{position:absolute;font-size:11px;letter-spacing:.12em;font-weight:700}
.lyo .mockup-label{right:22px;top:92px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lyo .mockup-label small{color:var(--mut);font-weight:500}
.lyo .scroll-note{right:22px;bottom:84px;display:flex;align-items:center;gap:6px;color:var(--mut)}
.lyo .hero-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;padding:18px 22px;background:rgba(10,10,12,.85);border-top:1px solid var(--line);font-size:13px;color:#d4d4da}
.lyo .hero-bottom span{display:flex;align-items:center;gap:8px}.lyo .hero-bottom svg{color:var(--red2)}
.lyo .about{display:grid;gap:32px}
.lyo .about-copy{display:grid;gap:16px;font-size:17px}
.lyo .problem-grid{display:grid;gap:16px;margin-top:40px}
.lyo .problem-grid article,.lyo .service-card,.lyo .steps article,.lyo .delivery,.lyo .contact-form,.lyo .service-invite{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.lyo .problem-grid article{display:grid;gap:12px;position:relative}
.lyo .problem-grid svg,.lyo .service-top svg{color:var(--red2)}
.lyo .card-number{position:absolute;right:22px;top:18px;font-weight:800;color:#2e2e36;font-size:28px}
.lyo .problem-grid p,.lyo .service-card p,.lyo .steps p,.lyo .reason-list p,.lyo .solution-list p{color:var(--mut);font-size:15px}
.lyo .solution{display:grid;gap:36px}
.lyo .solution .muted{margin-top:18px}
.lyo .solution-list,.lyo .reason-list{display:grid;gap:22px}
.lyo .solution-list>div,.lyo .reason-list>div{display:flex;gap:14px;align-items:flex-start}
.lyo .solution-list svg,.lyo .reason-list svg{color:var(--red2);flex:none;margin-top:3px}
.lyo .section-heading{display:grid;gap:16px;margin-bottom:36px}
.lyo .services-grid{display:grid;gap:16px}
.lyo .service-card{display:grid;gap:10px;align-content:start;transition:.2s}
.lyo .service-card:hover{border-color:var(--red);transform:translateY(-3px)}
.lyo .service-top{display:flex;justify-content:space-between;align-items:center;color:#4a4a55;font-weight:800}
.lyo .service-card small{color:var(--red2);font-size:11px;font-weight:700;letter-spacing:.12em}
.lyo .service-card a{display:inline-flex;align-items:center;gap:6px;color:var(--red2);font-weight:700;margin-top:6px}
.lyo .service-invite{display:grid;gap:12px;align-content:center;background:linear-gradient(135deg,#2a0a10,var(--card))}
.lyo .large-symbol{font-size:44px;color:var(--red2)}
.lyo .audience{margin-top:44px;text-align:center}
.lyo .audience p{font-size:11px;letter-spacing:.16em;color:var(--mut);margin-bottom:16px;font-weight:700}
.lyo .audience div{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lyo .audience span{border:1px solid #3a3a44;border-radius:999px;padding:9px 18px;font-size:14px}
.lyo .steps{display:grid;gap:16px;margin-top:40px}
.lyo .steps article{display:grid;gap:10px}
.lyo .steps article>span{color:var(--red2);font-weight:800;font-size:32px}
.lyo .reasons{display:grid;gap:36px}
.lyo .reason-list{margin-top:32px}
.lyo .delivery{display:grid;gap:14px;align-content:start;background:linear-gradient(160deg,#2a0a10,var(--card));border-color:#4a1018}
.lyo .delivery .eyebrow{margin:0}
.lyo .delivery ul{list-style:none;margin:6px 0;padding:0;display:grid;gap:10px}
.lyo .delivery li{display:flex;align-items:center;gap:10px;font-size:15px}
.lyo .delivery li svg{color:var(--red2)}
.lyo .delivery small,.lyo .contact-form small{color:var(--mut)}
.lyo .numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:1180px;margin:0 auto;padding:30px 22px;border-block:1px solid var(--line);text-align:center}
.lyo .numbers div{display:grid;gap:4px;justify-items:center}
.lyo .numbers strong{font-size:clamp(24px,6vw,44px);color:var(--red2)}
.lyo .numbers .support-title{font-size:clamp(18px,4vw,30px)}
.lyo .numbers span{font-size:12px;color:var(--mut)}
.lyo .faq{display:grid;gap:32px}
.lyo .faq .muted{margin-top:16px}
.lyo .faq details{border-bottom:1px solid var(--line);padding:18px 0}
.lyo .faq summary{display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;font-weight:700;list-style:none}
.lyo .faq summary::-webkit-details-marker{display:none}
.lyo .faq details[open] summary svg{transform:rotate(45deg);color:var(--red2)}
.lyo .faq summary svg{transition:.2s;flex:none}
.lyo .faq details p{margin-top:12px;color:var(--mut);font-size:15px}
.lyo .contact{display:grid;gap:36px}
.lyo .contact-intro{display:grid;gap:18px;justify-items:start}
.lyo .contact-links{display:grid;gap:12px;margin-top:8px}
.lyo .contact-links a{display:flex;align-items:center;gap:10px;color:#d4d4da}
.lyo .contact-links svg,.lyo .tiktok-mark{color:var(--red2)}
.lyo .contact-form{display:grid;gap:10px}
.lyo .contact-form p{color:var(--mut);font-size:14px;margin-bottom:6px}
.lyo .contact-form label{font-size:13px;font-weight:600;margin-top:6px}
.lyo .contact-form input,.lyo .contact-form select,.lyo .contact-form textarea{width:100%;background:#0d0d10;border:1px solid #33333b;border-radius:12px;padding:13px 14px;color:var(--txt);font:inherit;font-size:15px}
.lyo .contact-form input:focus,.lyo .contact-form select:focus,.lyo .contact-form textarea:focus{outline:0;border-color:var(--red2)}
.lyo .contact-form .button{margin-top:10px}
.lyo .site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:rgba(10,10,12,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.lyo .brand img{height:46px;width:auto;display:block}
.lyo .site-header nav{display:none;gap:28px;font-size:14px;color:#d4d4da}
.lyo .site-header nav a:hover{color:var(--red2)}
.lyo .button.small{padding:10px 18px;font-size:13px}
.lyo .hero-logo{display:block;width:min(300px,62vw);height:auto;margin-bottom:26px;filter:drop-shadow(0 0 22px rgba(225,29,46,.35))}
.lyo .site-footer{display:grid;justify-items:center;gap:14px;text-align:center;padding:56px 22px 40px;border-top:1px solid var(--line);color:var(--mut)}
.lyo .site-footer img{width:min(240px,60vw);height:auto}
.lyo .site-footer div{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px}
.lyo .site-footer a{display:inline-flex;align-items:center;gap:8px;color:#d4d4da}
.lyo .site-footer a:hover{color:var(--red2)}
.lyo .site-footer small{font-size:12px}
@media(min-width:820px){.lyo .site-header{padding:10px 40px}.lyo .site-header nav{display:flex}}
.lyo .hero-visual{display:none}
.lyo .gallery-grid{columns:2;column-gap:14px}
.lyo .gallery-item{display:block;width:100%;break-inside:avoid;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);cursor:zoom-in;transition:.25s}
.lyo .gallery-item:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 14px 40px rgba(225,29,46,.18)}
.lyo .gallery-item img{display:block;width:100%;height:auto}
.lyo .lightbox{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,5,7,.92);backdrop-filter:blur(8px);cursor:zoom-out}
.lyo .lightbox img{max-width:min(94vw,560px);max-height:90vh;width:auto;height:auto;border-radius:14px;box-shadow:0 20px 80px rgba(0,0,0,.7);cursor:default}
.lyo .lightbox-close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid #444;background:#141418;color:#fff;font-size:18px;cursor:pointer}
.lyo .float-social{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lyo .fs{display:inline-flex;align-items:center;justify-content:center;height:52px;min-width:52px;padding:0 14px;border-radius:999px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s;position:relative}
.lyo .fs:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.55)}
.lyo .fs span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:700;transition:max-width .3s,opacity .25s,margin .3s;margin:0}
.lyo .fs:hover span{max-width:200px;opacity:1;margin:0 4px 0 10px}
.lyo .fs-wa{background:#25d366}
.lyo .fs-wa::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid #25d366;animation:fsPulse 2.2s ease-out infinite;pointer-events:none}
.lyo .fs-ig{background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.lyo .fs-tt{background:#0b0b0d;border:1px solid #3a3a44}
@keyframes fsPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@media(prefers-reduced-motion:reduce){.lyo .fs-wa::after{animation:none}}
.lyo .code-rain{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.42}
.lyo .terminal{display:flex;align-items:center;gap:8px;min-height:22px;margin:0 0 18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#ff8a94;text-shadow:0 0 10px rgba(225,29,46,.6)}
.lyo .terminal .prompt{color:var(--red)}
.lyo .terminal i{display:inline-block;width:8px;height:15px;background:var(--red2);animation:termBlink 1s steps(1) infinite}
@keyframes termBlink{50%{opacity:0}}
@media(min-width:820px){
.lyo .gallery-grid{columns:4;column-gap:18px}
.lyo .gallery-item{margin-bottom:18px}
.lyo .hero h1{font-size:clamp(44px,5.4vw,72px)}
.lyo .hero-visual{display:block;position:absolute;right:3%;top:50%;transform:translateY(-47%);height:76%;max-height:760px;width:auto;opacity:.95;-webkit-mask-image:radial-gradient(ellipse 68% 70% at 55% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 68% 70% at 55% 50%,#000 52%,transparent 100%);pointer-events:none}
.lyo .mockup-label{display:none}
.lyo .fs-wa span{max-width:200px;opacity:1;margin:0 4px 0 10px}
.lyo .section{padding:110px 40px}.lyo .hero{padding:120px 40px 130px}
.lyo .about,.lyo .solution,.lyo .faq,.lyo .contact{grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.lyo .problem-grid{grid-template-columns:repeat(3,1fr)}
.lyo .steps{grid-template-columns:repeat(4,1fr)}
.lyo .services-grid{grid-template-columns:repeat(3,1fr)}
.lyo .reasons{grid-template-columns:1.2fr 1fr;gap:64px}
.lyo .section-heading{grid-template-columns:1fr 1fr;align-items:end}
.lyo .mockup-label{right:40px}.lyo .scroll-note{right:40px}
}
@media(max-width:819px){.lyo .mockup-label,.lyo .scroll-note{display:none}.lyo .desktop-break{display:none}}
